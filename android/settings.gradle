// Projeto Android do APK: é um TWA (Trusted Web Activity), ou seja, um invólucro
// do Chrome sobre o PWA publicado em https://bzs2pt.lovable.app.
//
// Regras que NÃO podem mudar, ou o app quebra para quem já instalou:
//  - applicationId fixo (br.com.estudoemlibras.app);
//  - mesmo keystore em todo build (ver docs/APK.md);
//  - versionCode sempre crescente, gerado a partir de src/lib/build.ts.
// Com isso o Android instala por cima da versão antiga e preserva o IndexedDB.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "EstudoEmLibras"
include ":app"
