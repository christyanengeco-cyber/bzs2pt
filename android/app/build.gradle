plugins {
    id 'com.android.application'
}

def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def siteUrl = 'https://bzs2pt.lovable.app'

android {
    namespace 'br.com.estudoemlibras.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.estudoemlibras.app'
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        // A página não consegue ler o versionCode do Android, então a versão do
        // APK viaja na própria startUrl. src/lib/atualizacao.ts lê esse ?v= e
        // compara com BUILD.versao para decidir se mostra o aviso de atualização.
        // Mexer aqui exige mexer lá.
        manifestPlaceholders = [twaUrl: "${siteUrl}/?v=${appVersionName}"]
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sem keystore no ambiente (build local de teste) o release sai sem
            // assinatura em vez de falhar. No CI o keystore sempre existe.
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
